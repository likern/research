schema = 1

[toolchain]
policy = "exact"
nushell_version_file = ".nushell-version"
typst_version_file = ".typst-version"
typst_override_env = "RESEARCH_TYPST"
local_tools_root = ".tools"

[workspace]
papers_root = "ydmp/papers"
templates_root = "ydmp/templates"
build_root = "build"

[typst]
default_format = "pdf"
default_variant = "candidate-c"
html_enabled = false
variants = [
  "candidate-a",
  "candidate-b",
  "candidate-c",
  "candidate-d",
  "candidate-strata",
]

[[documents]]
id = "template-notes-candidate-a"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes"]
inputs = { variant = "candidate-a", show-thoughts = "true" }

[[documents]]
id = "template-notes-candidate-b"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes"]
inputs = { variant = "candidate-b", show-thoughts = "true" }

[[documents]]
id = "template-notes-candidate-c"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes"]
inputs = { variant = "candidate-c", show-thoughts = "true" }

[[documents]]
id = "template-notes-candidate-d"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes"]
inputs = { variant = "candidate-d", show-thoughts = "true" }

[[documents]]
id = "template-notes-candidate-strata"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes", "strata"]
inputs = { variant = "candidate-strata", show-thoughts = "true" }

[[documents]]
id = "template-notes-candidate-c-clean"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes", "clean"]
inputs = { variant = "candidate-c", show-thoughts = "false" }

[[documents]]
id = "template-notes-candidate-strata-clean"
source = "ydmp/templates/notes/thoughts-example.typ"
formats = ["pdf"]
categories = ["template-preview", "notes", "clean", "strata"]
inputs = { variant = "candidate-strata", show-thoughts = "false" }

[[documents]]
id = "strata-validation-notes"
source = "ydmp/templates/notes/validation/strata-linearizability-notes.typ"
formats = ["pdf"]
categories = ["template-validation", "notes", "long-form", "strata"]
inputs = { variant = "candidate-strata", show-thoughts = "true" }

[[documents]]
id = "strata-validation-notes-clean"
source = "ydmp/templates/notes/validation/strata-linearizability-notes.typ"
formats = ["pdf"]
categories = ["template-validation", "notes", "long-form", "clean", "strata"]
inputs = { variant = "candidate-strata", show-thoughts = "false" }

[[documents]]
id = "strata-validation-session"
source = "ydmp/templates/notes/validation/strata-session-berenson.typ"
formats = ["pdf"]
categories = ["template-validation", "session", "long-form", "strata"]
inputs = { variant = "candidate-strata" }

[[documents]]
id = "strata-validation-model"
source = "ydmp/templates/notes/validation/strata-model-berenson.typ"
formats = ["pdf"]
categories = ["template-validation", "model", "long-form", "strata"]
inputs = { variant = "candidate-strata" }

[[documents]]
id = "strata-validation-verify"
source = "ydmp/templates/notes/validation/strata-verify-berenson.typ"
formats = ["pdf"]
categories = ["template-validation", "verify", "long-form", "strata"]
inputs = { variant = "candidate-strata" }

[[documents]]
id = "strata-diagram-implementation-gate"
source = "ydmp/templates/diagrams/specimens/implementation-gate.typ"
formats = ["pdf"]
categories = ["diagram-validation", "strata", "concurrency", "taomp"]
inputs = {}
