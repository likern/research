name: Temporary Pinega Web IA visual baselines

on:
  push:
    branches:
      - agent/pinega-web-ia-foundation
    paths:
      - "web/pages/**"
      - "web/content/**"
      - "web/src/**"
      - "web/tests/visual/site.visual.spec.ts"
      - ".github/workflows/update-web-ia-baselines.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-web-ia-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Validate and build website
        working-directory: web
        run: npm run tokens:check && npm run typecheck && npm run test:unit && npm run build && npm run check:build

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Generate the Web IA baseline corpus
        working-directory: web
        run: |
          set -euo pipefail
          rm -rf tests/visual/site.visual.spec.ts-snapshots
          npx --no-install playwright test tests/visual/site.visual.spec.ts \
            --project=chromium-desktop \
            --update-snapshots

      - name: Upload generated baselines
        uses: actions/upload-artifact@v7
        with:
          name: pinega-web-ia-visual-baselines-${{ github.sha }}
          path: web/tests/visual/site.visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7
