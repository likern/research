name: Temporary compile semantic diagram gate

on:
  push:
    branches:
      - "agent/diagram-implementation-gate"
    paths:
      - ".github/workflows/tmp-apply-diagram-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/diagram-implementation-gate

      - name: Read pinned Typst version
        id: versions
        shell: bash
        run: |
          echo "typst=$(tr -d '[:space:]' < .typst-version)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.versions.outputs.typst }}

      - name: Compile semantic diagram implementation gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          typst compile \
            --root . \
            ydmp/templates/diagrams/specimens/implementation-gate.typ \
            artifacts/strata-diagram-implementation-gate.pdf
          sha256sum artifacts/strata-diagram-implementation-gate.pdf \
            > artifacts/SHA256SUMS.txt

      - name: Upload semantic diagram PDF
        uses: actions/upload-artifact@v4
        with:
          name: strata-diagram-implementation-gate
          path: |
            artifacts/strata-diagram-implementation-gate.pdf
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
