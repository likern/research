name: Temporary commit academic diagram baselines

on:
  push:
    branches:
      - "agent/scientific-diagram-language-v0-2"
    paths:
      - ".github/workflows/tmp-commit-diagram-baselines.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/scientific-diagram-language-v0-2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Build website
        run: npm run build

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npm run test:visual -- --update-snapshots

      - name: Commit updated baselines
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/tests/visual
          if git diff --cached --quiet; then
            echo "Visual baselines are already current."
            exit 0
          fi
          git commit -m "Refresh academic diagram visual baselines"
          git push origin "HEAD:agent/scientific-diagram-language-v0-2"
