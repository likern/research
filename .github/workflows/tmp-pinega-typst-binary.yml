name: Temporary Pinega Typst binary

on:
  push:
    branches:
      - "tmp/pinega-brand-render"
    paths:
      - ".github/workflows/tmp-pinega-typst-binary.yml"
  pull_request:
    paths:
      - ".github/workflows/tmp-pinega-typst-binary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
      - name: Package compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "$(command -v typst)" artifact/typst
          chmod 0755 artifact/typst
          artifact/typst --version > artifact/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: typst-0.15.1-linux-x86_64
          path: artifact/
          if-no-files-found: error
