name: Check Pinega Website

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "design/**"
      - "web/**"
      - "docs/web-foundation.md"
      - ".github/workflows/check-web-foundation.yml"
  pull_request:
    paths:
      - "design/**"
      - "web/**"
      - "docs/web-foundation.md"
      - ".github/workflows/check-web-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out the review branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate and build the Web IA implementation
        run: npm run tokens:check && npm run typecheck && npm run test:unit && npm run build && npm run check:build

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Generate the complete Web IA visual baseline corpus
        run: |
          set -euo pipefail
          rm -rf tests/visual/site.visual.spec.ts-snapshots
          npx --no-install playwright test tests/visual/site.visual.spec.ts \
            --project=chromium-desktop \
            --update-snapshots=all

      - name: Commit the reviewed visual baselines to the PR branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/site.visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Visual baselines are already current."
            exit 0
          fi
          git commit -m "test(web): refresh Web IA visual baselines"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload the generated baseline corpus
        uses: actions/upload-artifact@v7
        with:
          name: pinega-web-ia-reviewed-baselines-${{ github.sha }}
          path: web/tests/visual/site.visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7
