name: Check Pinega Web Foundation

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "design/**"
      - "web/**"
      - "docs/web-foundation.md"
      - ".github/workflows/check-web-foundation.yml"
  pull_request:
    paths:
      - "design/**"
      - "web/**"
      - "docs/web-foundation.md"
      - ".github/workflows/check-web-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize the exact dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated design-token adapters
        run: npm run tokens:check

      - name: Type-check Web Components
        run: npm run typecheck

      - name: Run token and architecture tests
        run: npm run test:unit

      - name: Build the component laboratory
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser and accessibility tests
        run: npm run test:browser

      - name: Render visual baselines
        run: npm run test:visual -- --update-snapshots

      - name: Commit reproducibility artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/pinega-web-foundation-v0-1'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json web/tests/visual
          if git diff --cached --quiet; then
            echo "Dependency lock and visual baselines are already current."
            exit 0
          fi
          git commit -m "[skip ci] Record reproducible Pinega web artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record artifact checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          { find dist tests/visual -type f -print0 2>/dev/null || true; } \
            | sort -z \
            | xargs -0 -r sha256sum \
            > artifacts/SHA256SUMS.txt

      - name: Upload the validated foundation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinega-web-foundation-v0.1-${{ github.event_name }}
          path: |
            web/dist
            web/package-lock.json
            web/tests/visual
            web/test-results
            web/playwright-report
            web/artifacts/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
