name: Check Pinega Website

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "design/**"
      - "web/**"
      - "docs/web-foundation.md"
      - ".github/workflows/check-web-foundation.yml"
  pull_request:
    paths:
      - "design/**"
      - "web/**"
      - "docs/web-foundation.md"
      - ".github/workflows/check-web-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify generated design-token adapters
        run: npm run tokens:check

      - name: Type-check Web Components
        run: npm run typecheck

      - name: Run token and architecture tests
        run: npm run test:unit

      - name: Build the multi-page website
        run: npm run build

      - name: Enforce build and performance budgets
        run: npm run check:build

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Run browser and accessibility tests
        run: npm run test:browser

      - name: Temporarily generate Web IA visual baselines
        run: npm run test:visual -- --update-snapshots

      - name: Record artifact checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          { find dist tests/visual -type f -print0 2>/dev/null || true; } \
            | sort -z \
            | xargs -0 -r sha256sum \
            > artifacts/SHA256SUMS.txt

      - name: Upload the validated website
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pinega-website-v0.2-${{ github.event_name }}
          path: |
            web/dist
            web/package-lock.json
            web/tests/visual
            web/test-results
            web/playwright-report
            web/artifacts/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
