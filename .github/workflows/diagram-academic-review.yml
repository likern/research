name: Scientific diagram review artifacts

on:
  push:
    branches:
      - main
    paths:
      - "design/diagrams/**"
      - "design/tokens/**"
      - "design/generated/**"
      - "web/src/diagrams/**"
      - "web/src/styles/**"
      - "web/scripts/capture-diagram-review.mjs"
      - "web/tests/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/playwright.config.ts"
      - "ydmp/templates/diagrams/**"
      - ".typst-version"
      - ".github/workflows/diagram-academic-review.yml"
  pull_request:
    paths:
      - "design/diagrams/**"
      - "design/tokens/**"
      - "design/generated/**"
      - "web/src/diagrams/**"
      - "web/src/styles/**"
      - "web/scripts/capture-diagram-review.mjs"
      - "web/tests/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/playwright.config.ts"
      - "ydmp/templates/diagrams/**"
      - ".typst-version"
      - ".github/workflows/diagram-academic-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-diagrams-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read pinned versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          echo "typst=$(tr -d '[:space:]' < .typst-version)" >> "$GITHUB_OUTPUT"
          echo "diagrams=$(tr -d '[:space:]' < design/diagrams/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Determine immutable artifact name
        id: artifact
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scope="pr-${PR_NUMBER}"
          else
            scope="main-${GITHUB_SHA:0:12}"
          fi
          echo "name=scientific-diagrams-${scope}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Validate and build web diagrams
        working-directory: web
        run: npm run tokens:check && npm run typecheck && npm run test:unit && npm run build && npm run check:build

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify committed visual baselines
        working-directory: web
        run: npm run test:visual

      - name: Capture web review assets
        shell: bash
        env:
          PINEGA_DIAGRAM_VERSION: ${{ steps.versions.outputs.diagrams }}
        run: |
          set -euo pipefail
          review="$GITHUB_WORKSPACE/artifacts/scientific-diagrams/web"
          mkdir -p "$review"

          (
            cd "$GITHUB_WORKSPACE/web"
            npm run serve > "$review/server.log" 2>&1
          ) &
          server_pid=$!
          echo "$server_pid" > "$review/server.pid"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/research/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$review/server.log"
            exit 1
          fi

          node web/scripts/capture-diagram-review.mjs "$review"
          mkdir -p "$review/playwright-baselines"
          cp -R web/tests/visual/semantic-diagrams.visual.spec.ts-snapshots "$review/playwright-baselines/"

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "${{ steps.versions.outputs.typst }}"

      - name: Render Typst review assets
        shell: bash
        run: |
          set -euo pipefail
          review="artifacts/scientific-diagrams/typst"
          mkdir -p "$review/pdf" "$review/png"
          typst compile \
            --root . \
            --input diagram-version="${{ steps.versions.outputs.diagrams }}" \
            ydmp/templates/diagrams/specimens/academic-review.typ \
            "$review/pdf/academic-review.pdf"
          typst compile \
            --root . \
            --format png \
            --ppi 180 \
            --input diagram-version="${{ steps.versions.outputs.diagrams }}" \
            ydmp/templates/diagrams/specimens/academic-review.typ \
            "$review/png/academic-review-{p}.png"

      - name: Package models, metadata, and checksums
        shell: bash
        run: |
          set -euo pipefail
          review="artifacts/scientific-diagrams"
          mkdir -p "$review/models"
          cp design/diagrams/VERSION "$review/models/"
          cp design/diagrams/schema/diagram.schema.json "$review/models/"
          cp design/diagrams/models/*.json "$review/models/"

          cat > "$review/BUILD-METADATA.txt" <<EOF
          diagram_system_version=${{ steps.versions.outputs.diagrams }}
          event=${GITHUB_EVENT_NAME}
          repository=${GITHUB_REPOSITORY}
          ref=${GITHUB_REF}
          commit=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          artifact=${{ steps.artifact.outputs.name }}
          EOF

          find "$review" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$review/SHA256SUMS"

      - name: Upload immutable visual review artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/scientific-diagrams
          if-no-files-found: error
          retention-days: 30
