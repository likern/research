curriculum:
  curriculum_id: ydb-deep-mastery
  stage:
    id: isolation-theory
    order: 1
    name: Isolation и consistency
  position: Core reading near the beginning of stage 1, before OCC/MVCC and distributed-transaction implementation
    papers.
  prerequisites:
  - evidence: INFERRED
    text: Basic transaction histories, conflicting operations, and conflict-serializability.
  - evidence: INFERRED
    text: Two-phase locking, lock duration, and the purpose of predicate or range protection.
  - evidence: INFERRED
    text: MVCC snapshots and transaction start/commit ordering at the level of implementation concepts.
  why_now:
    evidence: INFERRED
    text: The paper supplies the anomaly vocabulary and dependency-oriented questions needed to compare
      YDB transaction guarantees without equating product-level names such as REPEATABLE READ or SERIALIZABLE
      with one implementation mechanism.
prepare:
  expected_problem:
    evidence: CONFIRMED
    text: The SQL-92 definition by three English-language phenomena does not uniquely characterize widely
      deployed locking and multiversion isolation behaviors.
  expected_contribution:
  - evidence: CONFIRMED
    text: Disambiguate strict anomaly instances A1-A3 from broader prohibited phenomena P1-P3.
  - evidence: CONFIRMED
    text: Add and use further phenomena, especially Dirty Write (P0), Lost Update (P4), Read Skew (A5A),
      and Write Skew (A5B).
  - evidence: CONFIRMED
    text: Define Snapshot Isolation using a transaction snapshot and a first-committer-wins rule, then
      place it in a partial order of isolation types.
  reading_scope:
    boundary:
      evidence: CONFIRMED
      text: Use this packet to orient attention; do not treat it as a replacement for deriving the example
        histories and comparisons.
    first_pass:
    - 'Abstract and §1: intended failure of the ANSI taxonomy.'
    - '§2.1-2.3: history, dependency graph, phenomena, and locking model.'
    - '§3: P0 plus the strict/broad interpretation argument.'
    - '§4.2: Snapshot Isolation and the H5 counterexample.'
    - 'Figure 2 and Table 4: final partial-order map.'
    derive_by_hand:
    - For H1-H5, write the dependency edges before reading the authors' conclusion.
    - For each table row, distinguish item locks from predicate locks.
    - For Snapshot Isolation, separate read visibility from commit validation.
    defer:
    - Detailed proof references to the longer OOBBGM version can be deferred until the paper's examples
      and definitions are stable.
    - Product-specific historical claims about 1990s implementations are context, not the first-pass learning
      target.
  potentially_unknown_terms:
  - term: phenomenon P_i versus anomaly A_i
    classification: paper_defined
    evidence: INFERRED
    reason: The notation is specific to this paper and may differ from the terminology used in PostgreSQL
      internals.
    reading_action: Record the quantifier/commit-abort difference, not only the name.
  - term: Degrees of Consistency (GLPT)
    classification: deferrable
    evidence: INFERRED
    reason: This historical naming is less likely to be central in a modern PostgreSQL-oriented mental
      model.
    reading_action: Map Degree 1/2/3 only after the locking table is clear.
  - term: predicate lock as protection of a logical, possibly absent set
    classification: prerequisite
    evidence: INFERRED
    reason: The paper uses a broader formal object than a row lock and ties it directly to P3.
    reading_action: Translate each predicate read into the set of possible conflicting writes.
  - term: MV-history and view equivalence
    classification: prerequisite
    evidence: INFERRED
    reason: The paper sketches this formal bridge but delegates fuller treatment to earlier literature
      and a longer version.
    reading_action: Do not assume a single-version history preserves version choice.
  - term: Cursor Stability
    classification: paper_defined
    evidence: INFERRED
    reason: It is a historically important intermediate isolation type but not a standard term in all
      current DBMS discussions.
    reading_action: Track exactly how long the current cursor row stays protected.
  - term: first-committer-wins
    classification: paper_defined
    evidence: INFERRED
    reason: The implementation idea may be familiar through MVCC, while the paper's timestamp interval
      formulation is more specific.
    reading_action: Write down the tested overlap of write sets at commit.
  pre_reading_questions:
  - id: Q1
    category: problem
    question: Which ambiguity in the SQL-92 prose lets two readers assign different operational meaning
      to the same named phenomenon?
  - id: Q2
    category: model
    question: What information must a history and its dependency graph retain for the paper's serializability
      comparisons?
  - id: Q3
    category: model
    question: How do the broad P1-P3 patterns differ logically from the strict A1-A3 anomaly instances?
  - id: Q4
    category: mechanism
    question: For P0-P3, which lock scope and duration would exclude each pattern in a single-version
      scheduler?
  - id: Q5
    category: invariants
    question: Why does Dirty Write matter simultaneously to database constraints and to rollback/recovery
      semantics?
  - id: Q6
    category: mechanism
    question: What additional protection does Cursor Stability add to READ COMMITTED, and where does that
      protection stop?
  - id: Q7
    category: mechanism
    question: Which two independent rules define Snapshot Isolation's read visibility and commit eligibility?
  - id: Q8
    category: failures
    question: Can you derive the dependency cycle in H5 without relying on the label Write Skew?
  - id: Q9
    category: failures
    question: Which counterexamples are needed to show that Snapshot Isolation and locking REPEATABLE
      READ are incomparable?
  - id: Q10
    category: evaluation
    question: Which claims are supported by constructed histories, equivalence arguments, or cited proofs,
      and which are merely implementation observations?
  - id: Q11
    category: YDB mapping
    question: Which YDB guarantees would need to be expressed as visibility, conflict, and commit-order
      rules before comparing them with this paper's levels?
  - id: Q12
    category: YDB mapping
    question: Across multiple DataShard participants, where would read-set, write-set, and predicate dependencies
      have to be detected or conservatively represented?
  comparison_targets:
  - target: SQL-92 strict A1-A3 versus broad P1-P3
    purpose: Separate observed symptoms from prohibited execution patterns.
  - target: locking REPEATABLE READ versus Snapshot Isolation
    purpose: Practice partial-order reasoning rather than a linear strength ranking.
  - target: Cursor Stability versus READ COMMITTED
    purpose: Identify a mechanism-specific intermediate guarantee.
  - target: PostgreSQL REPEATABLE READ and SERIALIZABLE
    purpose: Use existing PostgreSQL knowledge as a later verification target; do not import its semantics
      into the 1995 definitions.
  - target: Adya's generalized isolation model
    purpose: Follow-up reading for a more general dependency taxonomy.
  ydb_mapping_hypotheses:
  - evidence: HYPOTHESIS
    text: The paper's dependency-graph questions can be reused to specify cross-DataShard anomalies, but
      YDB's actual graph edges and validation points must be verified from authoritative YDB sources.
  - evidence: HYPOTHESIS
    text: Snapshot Isolation's first-committer-wins rule may be a useful comparison target for YDB optimistic-lock
      or write-conflict handling; equivalence must not be assumed.
  - evidence: HYPOTHESIS
    text: P3 highlights the need to reason about predicate or range reads whose conflicting writes may
      occur on different shards.
  - evidence: HYPOTHESIS
    text: The Start-Timestamp/Commit-Timestamp split may prepare later analysis of YDB logical time, PlanStep,
      and visibility, but this paper alone does not establish that mapping.
