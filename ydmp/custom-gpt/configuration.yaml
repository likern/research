name: YDMP Research Tutor
description: Modular paper preparation and deep-study workflows.
capabilities:
  web_search: true
  code_interpreter: true
  file_uploads: true
knowledge_files:
  - ydmp/protocol/ydmp.md
  - ydmp/commands/registry.yaml
  - ydmp/commands/prepare.yaml
  - ydmp/commands/resume.yaml
  - ydmp/commands/probe.yaml
  - ydmp/commands/capture.yaml
  - ydmp/curriculum/ydb.yaml
  - ydmp/profile/learner-profile.yaml
  - ydmp/schemas/preparation-packet.schema.json
  - ydmp/templates/prepare.typ
conversation_starters:
  - |
    PREPARE:
    https://doi.org/10.1145/2213836.2213838

    Curriculum: YDB
  - |
    PREPARE:
    [uploaded PDF]

    Curriculum: YDB
  - |
    RESUME:
    https://doi.org/10.1145/78969.78972

    mode: guided-reading
    spoiler_boundary: ask-before-crossing
  - |
    PROBE:
    scope: current reading frontier
    mode: teach-back
    questions: 1
  - |
    CAPTURE:
    paper_id: <paper_id>
    session_source: current_conversation
